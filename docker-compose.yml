name: ids-observability

services:
  cert-init:
    image: alpine:3.21
    restart: "no"
    environment:
      GRAFANA_CERT_CN: ${GRAFANA_CERT_CN:-ids-grafana}
      GRAFANA_CERT_SAN: ${GRAFANA_CERT_SAN:-DNS:localhost,IP:127.0.0.1}
      GRAFANA_TLS_DAYS: ${GRAFANA_TLS_DAYS:-825}
    volumes:
      - ./certs:/certs
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -f /certs/grafana.crt ] && [ -f /certs/grafana.key ]; then
          echo "TLS certs already present in /certs"
          exit 0
        fi
        apk add --no-cache openssl
        openssl req -x509 -nodes -days "$${GRAFANA_TLS_DAYS}" -newkey rsa:2048 \
          -keyout /certs/grafana.key \
          -out /certs/grafana.crt \
          -subj "/CN=$${GRAFANA_CERT_CN}" \
          -addext "subjectAltName=$${GRAFANA_CERT_SAN}"
        chmod 644 /certs/grafana.crt /certs/grafana.key
        echo "Generated /certs/grafana.crt"

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    env_file: .env
    command: -config.file=/etc/loki/config.yaml -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-168h}
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8

  vector:
    image: timberio/vector:0.43.1-alpine
    restart: unless-stopped
    env_file: .env
    depends_on:
      loki:
        condition: service_healthy
    environment:
      VECTOR_LOG: info
    volumes:
      - ./vector/${VECTOR_CONFIG:-vector.toml}:/etc/vector/vector.toml:ro
      - vector-data:/var/lib/vector
      - ${SURICATA_LOG_DIR}:/logs/suricata:ro
      # Zeekctl: live-логи в spool/logger; logs/current — symlink туда.
      # Монтируем РОДИТЕЛЯ /opt/zeek/spool, не logger/: после zeekctl deploy
      # каталог logger пересоздаётся (новый inode) и bind на него «пустеет»
      # (Docker inode mount — https://stackoverflow.com/q/53547973).
      - ${ZEEK_SPOOL_DIR:-/opt/zeek/spool}:/logs/zeek-spool:ro
    command: ["--config", "/etc/vector/vector.toml"]
    healthcheck:
      test: ["CMD", "vector", "validate", "/etc/vector/vector.toml"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    env_file: .env
    depends_on:
      cert-init:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/grafana/certs/grafana.crt
      GF_SERVER_CERT_KEY: /etc/grafana/certs/grafana.key
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://localhost:3000}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY_MAX_AGE_SECONDS: "86400"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY_PRELOAD: "true"
      GF_ALERTING_ENABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./certs:/etc/grafana/certs:ro
    ports:
      - "${GRAFANA_BIND:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  loki-data:
  vector-data:
  grafana-data:
