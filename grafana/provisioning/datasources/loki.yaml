apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: community_id
          matcherRegex: '"community_id"\s*:\s*"([^"]+)"'
          url: /d/ids-compare/ids-zeek-vs-suricata?var-community_id=${__value.raw}
          datasourceUid: loki
